name: Validate Veridia Agents

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agents-runtime/**'
      - 'scripts/verify-and-collect.sh'
      - '.github/CODEOWNERS'
      - '.github/workflows/validate-veridia-agents.yml'
  push:
    branches:
      - main
      - agent/veridia-agents-node18-updates
    paths:
      - 'agents-runtime/**'
      - 'scripts/verify-and-collect.sh'
      - '.github/CODEOWNERS'
      - '.github/workflows/validate-veridia-agents.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Veridia Agents
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Validate and collect evidence
        run: bash scripts/verify-and-collect.sh

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veridia-agents-evidence-${{ github.sha }}
          path: |
            artifacts/veridia-agents/
            artifacts/veridia-agents-evidence.tar.gz
            artifacts/veridia-agents-evidence.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
