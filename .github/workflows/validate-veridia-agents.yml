name: Validate Veridia Agents

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agents-runtime/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/validate-veridia-agents.yml'
  push:
    branches:
      - main
      - agent/veridia-agents-node18-updates
    paths:
      - 'agents-runtime/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/validate-veridia-agents.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Veridia Agents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: agents-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: agents-runtime/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate agents and fixtures
        run: npm test
