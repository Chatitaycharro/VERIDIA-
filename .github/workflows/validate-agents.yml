name: Validate Veridia agents
on:
  pull_request:
    paths: ['agents/**','config/**','schema/**','scripts/**','package.json','package-lock.json']
  push:
    branches: [main]
    paths: ['agents/**','config/**','schema/**','scripts/**','package.json','package-lock.json']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Validate YAML agents
        run: npm run validate
