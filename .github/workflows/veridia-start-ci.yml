name: Veridia Start Strict CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'veridia_start/**'
      - '.github/workflows/veridia-start-ci.yml'
  push:
    branches:
      - feature/veridia-start-v1-strict
    paths:
      - 'veridia_start/**'
      - '.github/workflows/veridia-start-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run strict launcher on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x veridia_start/start_strict.sh
          ./veridia_start/start_strict.sh

      - name: Run strict launcher on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./veridia_start/start_strict.ps1

      - name: Verify detector output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          outputs = sorted(Path('veridia_start/logs').glob('detector_output_*.json'))
          if not outputs:
              raise SystemExit('No detector output was generated')
          data = json.loads(outputs[-1].read_text(encoding='utf-8-sig'))
          if data.get('corpus_documents') != 2:
              raise SystemExit(f"Expected 2 corpus documents, got {data.get('corpus_documents')}")
          items = data.get('items', [])
          if len(items) != 1:
              raise SystemExit(f'Expected exactly 1 alert, got {len(items)}')
          if set(items[0].get('matched_terms', [])) != {'evidencia', 'trazabilidad'}:
              raise SystemExit(f"Unexpected terms: {items[0].get('matched_terms')}")
          print('Detector output verified successfully')
          PY

      - name: Confirm generated files are ignored
        shell: bash
        run: |
          if git status --short --untracked-files=all | grep -E 'veridia_start/(logs|auditoria)/'; then
            echo 'Generated logs or audit files are not ignored' >&2
            exit 1
          fi

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veridia-start-${{ runner.os }}-${{ github.sha }}
          path: |
            veridia_start/logs/*.json
            veridia_start/auditoria/*.md
          if-no-files-found: error
          retention-days: 30
